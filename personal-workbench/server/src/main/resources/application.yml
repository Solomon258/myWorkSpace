server:
  port: ${SERVER_PORT:18080}
  address: ${SERVER_ADDRESS:127.0.0.1}
  servlet:
    session:
      timeout: 7d
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: personal-workbench
  servlet:
    multipart:
      # 全局档位取「文档」这一档；图片的 10MB 由 AttachmentService 按类型再判一次
      # —— Spring 这里是全局配置，做不到按文件类型区分上限。
      max-file-size: 100MB
      # 前端多选是循环调用（一次请求一个文件），留一点余量给 multipart 边界即可
      max-request-size: 110MB
      # 超过 1MB 就落到临时文件，避免大附件整个读进内存
      file-size-threshold: 1MB
  datasource:
    driver-class-name: org.sqlite.JDBC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    clean-disabled: true
    validate-on-migrate: true
  jackson:
    default-property-inclusion: always
    time-zone: Asia/Shanghai

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    shutdown:
      enabled: false
    health:
      show-details: never

workbench:
  data-dir: ${WORKBENCH_DATA_DIR:${workbench.data:./data}}
  home-dir: ${WORKBENCH_HOME:${workbench.home:./}}
  timezone: Asia/Shanghai

logging:
  file:
    name: ${WORKBENCH_HOME:${workbench.home:./}}/logs/workbench.log
  level:
    root: INFO
    com.icecode.workbench: DEBUG
    org.flywaydb: INFO
---
spring:
  config:
    activate:
      on-profile: dev
server:
  address: 0.0.0.0
