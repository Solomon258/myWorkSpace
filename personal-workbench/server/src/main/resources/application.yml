server:
  port: ${SERVER_PORT:18080}
  address: ${SERVER_ADDRESS:127.0.0.1}
  servlet:
    session:
      timeout: 7d
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: personal-workbench
  servlet:
    multipart:
      # 全局档位取「文档」这一档；图片的 10MB 由 AttachmentService 按类型再判一次
      # —— Spring 这里是全局配置，做不到按文件类型区分上限。
      max-file-size: 100MB
      # 前端多选是循环调用（一次请求一个文件），留一点余量给 multipart 边界即可
      max-request-size: 110MB
      # 超过 1MB 就落到临时文件，避免大附件整个读进内存
      file-size-threshold: 1MB
  datasource:
    driver-class-name: org.sqlite.JDBC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    clean-disabled: true
    validate-on-migrate: true
  jackson:
    default-property-inclusion: always
    time-zone: Asia/Shanghai

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    shutdown:
      enabled: false
    health:
      show-details: never

workbench:
  data-dir: ${WORKBENCH_DATA_DIR:${workbench.data:./data}}
  home-dir: ${WORKBENCH_HOME:${workbench.home:./}}
  timezone: Asia/Shanghai

logging:
  file:
    name: ${WORKBENCH_HOME:${workbench.home:./}}/logs/workbench.log
  level:
    root: INFO
    com.icecode.workbench: DEBUG
    org.flywaydb: INFO
---
spring:
  config:
    activate:
      on-profile: dev
  # 开发档：静态资源只发 Last-Modified、不发 Cache-Control 时，浏览器会按启发式规则
  # （大致是「距今时长 × 10%」）自己判定新鲜度。样式文件几天没动过，这个窗口就能长到几小时
  # —— 于是出现「改了 style.css、重启了容器、浏览器里却没变化」，而服务端其实已经是新文件
  # （curl 抓一遍就能确认，2026-09-17 就这么排查了一轮）。
  # 加 no-cache 后每次加载都带 If-Modified-Since 回来问一次：没变 304，变了立刻生效。
  # 只加在 dev 档，不影响打包运行时的表现。
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true
server:
  address: 0.0.0.0
